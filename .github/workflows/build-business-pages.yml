name: Build business and landing pages

on:
  push:
    branches: [main]
    paths: ['scripts/generate_business_pages.py', 'scripts/generate_landing_pages.py']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-business-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate business pages, sitemap and manifest
        run: python3 scripts/generate_business_pages.py

      - name: Generate landing pages and merge sitemap
        run: python3 scripts/generate_landing_pages.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add business/ classes/ sitemap.xml business-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Regenerate business and landing pages [skip ci]"
          git push
