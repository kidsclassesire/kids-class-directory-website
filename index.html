<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Kids Class Directory Ireland | Find Local Classes &amp; Activities for Children">
    <meta property="og:description" content="Browse 900+ kids classes and activities across Ireland — sports, dance, music, STEM, swimming and more. Filter by age, location and category to find the right class for your child.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.kidspatch.ie/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kids Class Directory Ireland | Find Local Classes &amp; Activities for Children">
    <meta name="twitter:description" content="Browse 900+ kids classes and activities across Ireland — sports, dance, music, STEM, swimming and more. Filter by age, location and category to find the right class for your child.">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

    <link rel="stylesheet" href="styles.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kids Class Directory",
      "url": "https://www.kidspatch.ie/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.kidspatch.ie/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</head>
<body>

    <header id="hero" class="hero-initial">
        <div class="hero-text">
            <h1>Discover Kids Classes</h1>
            <p>Find the best local activities for your children.</p>
        </div>
        <div class="search-bar">
            <div class="search-input-group">
                <label for="search-input">Activity</label>
                <input id="search-input" type="text" placeholder="e.g. athletics, coding">
            </div>
            <div class="search-divider"></div>
            <div class="search-input-group">
                <label for="location-input">Where</label>
                <div style="display: flex; align-items: center; width: 100%;">
                    <input id="location-input" type="text" placeholder="e.g. Dublin 16" style="flex: 1;">
                    <button id="near-me-btn" class="near-me-btn" aria-label="Use my location" title="Find near me">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v2m0 16v2m10-10h-2M4 12H2m15.364-7.364l-1.414 1.414M6.05 17.95l-1.414 1.414m13.314 0l-1.414-1.414M6.05 6.05L4.636 4.636"></path></svg>
                    </button>
                </div>
            </div>
            <button id="search-btn" class="search-btn">
                <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" fill="none" stroke-width="3"><path d="M13 3C7.477 3 3 7.477 3 13s4.477 10 10 10c2.395 0 4.593-.84 6.31-2.24l6.983 6.982 1.414-1.414-6.982-6.983A9.957 9.957 0 0023 13c0-5.523-4.477-10-10-10zm0 2c4.43 0 8 3.57 8 8s-3.57 8-8 8-8-3.57-8-8 3.57-8 8-8z"/></svg>
            </button>
        </div>
    </header>

    <main id="main-content">
        <div class="results-column">
            
            <!-- Granular Filter Bar -->
            <div class="filter-bar-wrap">
                <div class="filter-bar">
                    <select id="category-filter" class="filter-select">
                        <option value="">Any Category</option>
                    </select>

                    <select id="age-filter" class="filter-select">
                        <option value="">Any Age</option>
                        <option value="toddler">Under 5 Years</option>
                        <option value="child">5 - 8 Years</option>
                        <option value="preteen">9 - 12 Years</option>
                        <option value="teen">13+ Years</option>
                    </select>

                    <select id="day-filter" class="filter-select">
                        <option value="">Any Day</option>
                        <option value="weekday">Weekdays</option>
                        <option value="weekend">Weekends</option>
                    </select>

                    <label class="toggle-label">
                        <input type="checkbox" id="dropoff-filter">
                        Drop-off Allowed
                    </label>

                    <label class="toggle-label">
                        <input type="checkbox" id="favorites-only-filter">
                        <span id="favorites-toggle-text">My Shortlist (0)</span>
                    </label>

                    <select id="radius-filter" class="filter-select" title="Set a location above to use this">
                        <option value="">Any Distance</option>
                        <option value="5">Within 5 km</option>
                        <option value="10">Within 10 km</option>
                        <option value="20">Within 20 km</option>
                        <option value="50">Within 50 km</option>
                    </select>

                    <select id="sort-select" class="filter-select" title="Set a location above to sort by distance">
                        <option value="relevance">Sort: Relevance</option>
                        <option value="distance">Sort: Nearest First</option>
                    </select>
                </div>
            </div>

            <div id="result-meta"><span id="result-count">Loading classes...</span></div>
            <div id="directory-container"></div>
            <div id="pagination-controls" class="pagination"></div>
        </div>
        
        <div class="map-column">
            <div id="map"></div>
        </div>
    </main>

    <!-- Claim Business Modal -->
    <div id="claim-modal" class="modal-overlay">
        <div class="modal">
            <button id="close-modal" class="close-modal">&times;</button>
            <h3 id="modal-business-name">Claim Business</h3>
            <p>Verify your ownership to manage this page and update your details.</p>
            
            <form id="claim-form">
                <input type="hidden" id="claim-business-id">
                <input type="hidden" id="claim-business-title">
                
                <div class="form-group">
                    <label for="claim-name">Your Full Name</label>
                    <input type="text" id="claim-name" required placeholder="e.g. Jane Doe">
                </div>
                <div class="form-group">
                    <label for="claim-email">Business Email Address</label>
                    <input type="email" id="claim-email" required placeholder="e.g. jane@yourbusiness.ie">
                    <small style="color:#64748b; font-size: 0.75rem; display:block; margin-top:4px;">Must be an official business domain.</small>
                </div>
                <div class="form-group">
                    <label for="claim-position">Your Position / Role</label>
                    <input type="text" id="claim-position" required placeholder="e.g. Owner, Manager">

            <div id="claim-success" style="display: none; text-align: center; color: #166534; background: #dcfce7; padding: 1.5rem; border-radius: 8px;">
                <strong>Request Submitted!</strong><br>We will review your details and email you portal access shortly.
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.SUPABASE_URL = window.SUPABASE_URL || 'https://gnozodfteywsiwcnbwch.supabase.co';
        window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_eduvbMySPxHPT0iZjE_LqQ_w6nyjnjY';
        // Single shared client -- creating multiple instances triggers a "Multiple GoTrueClient
        // instances" warning and duplicate auth listeners for no benefit.
        window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    </script>
    
    <script>
        // Utility function to escape HTML inside dynamic strings
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        const searchInput = document.getElementById('search-input');
        const locationInput = document.getElementById('location-input');
        const nearMeBtn = document.getElementById('near-me-btn');
        const searchBtn = document.getElementById('search-btn');
        
        const categoryFilter = document.getElementById('category-filter');
        const ageFilter = document.getElementById('age-filter');
        const dayFilter = document.getElementById('day-filter');
        const dropoffFilter = document.getElementById('dropoff-filter');
        const radiusFilter = document.getElementById('radius-filter');
        const sortSelect = document.getElementById('sort-select');
        const favoritesOnlyFilter = document.getElementById('favorites-only-filter');

        const heroSection = document.getElementById('hero');
        const mainContent = document.getElementById('main-content');

        let classesData = [];
        let filteredData = [];
        const pageSize = 12;
        let currentPage = 1;
        let hasTriggeredSearch = false;
        let lastGeocodedQuery = null;
        let isGeocoding = false;
        let sortExplicitlySet = false;

        let map;
        let markerClusterGroup = null;

        let userLat = null;
        let userLon = null;

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // --- Favorites / Shortlist (localStorage, no login required) ---
        let favoriteKeys = new Set(JSON.parse(localStorage.getItem('favoriteClassKeys') || '[]'));

        function getItemKey(item) {
            return item.id != null ? `id:${item.id}` : `na:${item.company_name}|${item.address || ''}`;
        }

        function updateFavoritesToggleLabel() {
            const label = document.getElementById('favorites-toggle-text');
            if (label) label.textContent = `My Shortlist (${favoriteKeys.size})`;
        }

        function toggleFavorite(key) {
            if (favoriteKeys.has(key)) favoriteKeys.delete(key); else favoriteKeys.add(key);
            localStorage.setItem('favoriteClassKeys', JSON.stringify([...favoriteKeys]));
            updateFavoritesToggleLabel();
            if (favoritesOnlyFilter.checked) {
                filterClasses();
            } else {
                renderPage();
            }
        }

        updateFavoritesToggleLabel();

        // --- Star Ratings (1-5, no login required) ---
        // ratingsByClassId: class id -> { sum, count } aggregated from all voters.
        // myRatingsByClassId: class id -> this browser's own rating (1-5), so the
        // star input can show what you already picked.
        let ratingsByClassId = new Map();
        let myRatingsByClassId = new Map();
        let ratingsLoaded = false;

        function getOrCreateVoterId() {
            let voterId = localStorage.getItem('voterId');
            if (!voterId) {
                voterId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
                localStorage.setItem('voterId', voterId);
            }
            return voterId;
        }
        const voterId = getOrCreateVoterId();

        async function loadRatings() {
            if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) return;
            try {
                const supabase = window.supabaseClient;
                const { data, error } = await supabase.from('class_ratings').select('class_id, voter_id, rating');
                if (error) throw error;
                ratingsByClassId = new Map();
                myRatingsByClassId = new Map();
                (data || []).forEach(r => {
                    const agg = ratingsByClassId.get(r.class_id) || { sum: 0, count: 0 };
                    agg.sum += r.rating;
                    agg.count += 1;
                    ratingsByClassId.set(r.class_id, agg);
                    if (r.voter_id === voterId) myRatingsByClassId.set(r.class_id, r.rating);
                });
            } catch (err) {
                // Table may not exist yet (migration not run) -- ratings are an enhancement,
                // not core functionality, so fail quietly and just show no ratings.
                console.warn('Ratings unavailable:', err.message || err);
            } finally {
                ratingsLoaded = true;
            }
        }

        async function submitRating(classId, rating) {
            const agg = ratingsByClassId.get(classId) || { sum: 0, count: 0 };
            const previousMine = myRatingsByClassId.get(classId);

            // Optimistic update so the average reflects the vote immediately.
            if (previousMine !== undefined) {
                agg.sum += (rating - previousMine);
            } else {
                agg.sum += rating;
                agg.count += 1;
            }
            ratingsByClassId.set(classId, agg);
            myRatingsByClassId.set(classId, rating);
            renderPage();

            try {
                const supabase = window.supabaseClient;
                const { error } = await supabase.from('class_ratings')
                    .upsert({ class_id: classId, voter_id: voterId, rating, updated_at: new Date().toISOString() },
                        { onConflict: 'class_id,voter_id' });
                if (error) throw error;
            } catch (err) {
                console.warn('Could not save rating:', err.message || err);
            }
        }

        // Ireland bounding box, used to reject wrong-country geocoding matches
        const IE_BOUNDS = { latMin: 51.0, latMax: 55.5, lonMin: -10.5, lonMax: -5.0 };

        async function geocodeLocation(query) {
            const hasIreland = /dublin|ireland/i.test(query);
            const q = hasIreland ? query : `${query}, Co. Dublin, Ireland`;
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ie&q=${encodeURIComponent(q)}`;
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) return null;
                const results = await res.json();
                if (!results.length) return null;
                const lat = parseFloat(results[0].lat);
                const lon = parseFloat(results[0].lon);
                if (lat < IE_BOUNDS.latMin || lat > IE_BOUNDS.latMax || lon < IE_BOUNDS.lonMin || lon > IE_BOUNDS.lonMax) {
                    return null;
                }
                return { lat, lon };
            } catch (err) {
                console.warn('Geocoding failed:', err);
                return null;
            }
        }

        const CATEGORY_GROUPS = [
            ['Sports & Fitness', ['Athletics', 'Basketball', 'Football', 'GAA', 'Gymnastics', 'Hockey',
                'Horse Riding', 'Martial Arts', 'Rugby', 'Sports', 'Swimming', 'Team Sports', 'Tennis', 'Watersports']],
            ['Arts, Music & Drama', ['Arts and crafts', 'Cooking', 'Dance', 'Drama', 'Music']],
            ['Baby & Toddler', ['Developmental', 'Parent-and-toddler']],
            ['Academic & STEM', ['Academic Support', 'Languages', 'STEM']],
            ['Camps & Outdoor', ['Camps', 'Outdoor']],
        ];

        function populateCategoryFilter() {
            const present = new Set(classesData.map(item => item.category).filter(Boolean));
            let html = '<option value="">Any Category</option>';
            const grouped = new Set();

            CATEGORY_GROUPS.forEach(([groupLabel, members]) => {
                const inGroup = members.filter(c => present.has(c)).sort();
                if (!inGroup.length) return;
                inGroup.forEach(c => grouped.add(c));
                html += `<optgroup label="${escapeHtml(groupLabel)}">` +
                    inGroup.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') +
                    '</optgroup>';
            });

            const leftover = [...present].filter(c => !grouped.has(c)).sort();
            if (leftover.length) {
                html += '<optgroup label="Other">' +
                    leftover.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') +
                    '</optgroup>';
            }

            categoryFilter.innerHTML = html;
        }

        function initMap() {
            if (map) return;
            map = L.map('map').setView([53.3498, -6.2603], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        async function loadClasses() {
            try {
                if (window.SUPABASE_ANON_KEY && window.SUPABASE_URL) {
                    const supabase = window.supabaseClient;
                    const { data, error } = await supabase.from('classes').select('*');
                    if (!error && data) {
                        classesData = data;
                        return;
                    }
                }
            } catch (err) {
                console.warn('Supabase unavailable, falling back to local JSON:', err);
            }

            // Fallback
            return fetch('south_dublin_kids_activities.json')
                .then(response => response.json())
                .then(data => { classesData = data; })
                .catch(error => { console.error('Error loading data:', error); });
        }

        // Manifest of id -> generated business/*.html path (built by
        // scripts/generate_business_pages.py). Used to link each card to its
        // own static, indexable page. Missing entirely on the local-JSON
        // fallback path -- that's fine, cards just skip the link.
        let businessIndex = new Map();

        async function loadBusinessIndex() {
            try {
                const res = await fetch('business-index.json');
                if (!res.ok) return;
                const data = await res.json();
                businessIndex = new Map(Object.entries(data));
            } catch (err) {
                console.warn('business-index.json unavailable:', err);
            }
        }

        function updateMap() {
            if (markerClusterGroup) {
                map.removeLayer(markerClusterGroup);
            }
            // Nearby pins collapse into a single numbered cluster until zoomed in --
            // with 500+ results (Ireland-wide) showing every pin individually made the
            // map an unreadable wall of overlapping markers.
            markerClusterGroup = L.markerClusterGroup({ maxClusterRadius: 50 });

            filteredData.forEach((item, index) => {
                const lat = item.latitude;
                const lng = item.longitude;
                if (!lat || !lng) return; // Skip: no verified coordinates, don't fabricate a pin location

                const marker = L.marker([lat, lng]);
                marker.bindPopup(`<b>${item.company_name}</b><br>${item.category || 'Class'}`);

                marker.on('click', () => {
                    const pageNum = Math.floor(index / pageSize) + 1;
                    if (currentPage !== pageNum) {
                        currentPage = pageNum;
                        renderPage();
                    }
                    const card = document.getElementById(`card-${index}`);
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        card.style.borderColor = 'var(--primary)';
                        setTimeout(() => card.style.borderColor = 'var(--border)', 2000);
                    }
                });

                markerClusterGroup.addLayer(marker);
            });

            map.addLayer(markerClusterGroup);
            if (markerClusterGroup.getLayers().length > 0) {
                map.fitBounds(markerClusterGroup.getBounds(), { padding: [30, 30] });
            }
        }

        function filterClasses() {
            const q = searchInput.value.trim().toLowerCase();
            const l = locationInput.value.trim().toLowerCase();
            const cat = categoryFilter.value;
            const ageBracket = ageFilter.value;
            const dayBracket = dayFilter.value;
            const needsDropoff = dropoffFilter.checked;
            const favoritesOnly = favoritesOnlyFilter.checked;
            const radiusKm = radiusFilter.value ? parseFloat(radiusFilter.value) : null;
            const hasOrigin = userLat !== null && userLon !== null;

            filteredData = classesData.filter(item => {
                const textMatch = q === '' || [item.company_name, item.category, item.description].some(v => v && v.toString().toLowerCase().includes(q));

                // Compute distance from the active search origin (geolocation or a geocoded
                // typed location) whenever both are available, for display/sort purposes.
                item._distanceKm = (hasOrigin && item.latitude && item.longitude)
                    ? getDistance(userLat, userLon, item.latitude, item.longitude)
                    : undefined;

                let locMatch = true;
                if (hasOrigin) {
                    if (radiusKm !== null) {
                        // An explicit radius was requested: items without coordinates can't be
                        // verified as within range, so they're excluded rather than assumed-ok.
                        locMatch = item._distanceKm !== undefined && item._distanceKm <= radiusKm;
                    } else {
                        // No radius set: don't exclude on distance, just use it for sort/display.
                        locMatch = true;
                    }
                } else {
                    locMatch = l === '' || [item.address, item.eircode].some(v => v && v.toString().toLowerCase().includes(l));
                }

                const catMatch = cat === '' || (item.category && item.category === cat);
                const dropoffMatch = !needsDropoff || (item.parental_requirement === 'Drop-off');
                const favMatch = !favoritesOnly || favoriteKeys.has(getItemKey(item));

                let ageMatch = true;
                if (ageBracket !== '') {
                    const min = item.minimum_age !== null ? item.minimum_age : 0;
                    const max = item.maximum_age !== null ? item.maximum_age : 99;
                    if (ageBracket === 'toddler') ageMatch = (min <= 4);
                    if (ageBracket === 'child') ageMatch = (min <= 8 && max >= 5);
                    if (ageBracket === 'preteen') ageMatch = (min <= 12 && max >= 9);
                    if (ageBracket === 'teen') ageMatch = (max >= 13);
                }

                let dayMatch = true;
                if (dayBracket !== '') {
                    const days = Array.isArray(item.days_of_week) ? item.days_of_week.join(' ') : (item.days_of_week || '');
                    if (dayBracket === 'weekend') {
                        dayMatch = days.toLowerCase().includes('saturday') || days.toLowerCase().includes('sunday');
                    } else if (dayBracket === 'weekday') {
                        dayMatch = ['monday','tuesday','wednesday','thursday','friday'].some(d => days.toLowerCase().includes(d));
                    }
                }

                return textMatch && locMatch && catMatch && dropoffMatch && favMatch && ageMatch && dayMatch;
            });

            if (sortSelect.value === 'distance' && hasOrigin) {
                filteredData.sort((a, b) => {
                    const da = a._distanceKm !== undefined ? a._distanceKm : Infinity;
                    const db = b._distanceKm !== undefined ? b._distanceKm : Infinity;
                    return da - db;
                });
            }

            currentPage = 1;
            let countMsg = `${filteredData.length} classes found`;
            if (l && !hasOrigin && lastGeocodedQuery === l) {
                countMsg += ` — couldn't pinpoint "${locationInput.value}", showing text matches instead`;
            }
            document.getElementById('result-count').textContent = countMsg;
            renderPage();

            setTimeout(() => { if (map) { map.invalidateSize(); updateMap(); } }, 100);

            const params = new URLSearchParams();
            if (q) params.set('q', q);
            if (locationInput.value) params.set('loc', locationInput.value);
            if (cat) params.set('cat', cat);
            if (ageBracket) params.set('age', ageBracket);
            if (dayBracket) params.set('day', dayBracket);
            if (needsDropoff) params.set('dropoff', 'true');
            if (radiusKm) params.set('radius', radiusKm);
            if (sortSelect.value !== 'relevance') params.set('sort', sortSelect.value);
            window.history.pushState(null, '', '?' + params.toString());
        }

        function renderClasses(data, globalStartIndex) {
            const container = document.getElementById('directory-container');
            container.innerHTML = '';
            
            if (!data.length) {
                container.innerHTML = '<p style="grid-column: 1/-1; padding: 2rem 0; color: #64748b;">No classes match these exact filters. Try adjusting your selections.</p>';
                return;
            }

            const pinIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 21s-7-7.5-7-12a7 7 0 1114 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.3" fill="currentColor" stroke="none"/></svg>';
            const heartIcon = (filled) => filled
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>';

            function cardImageHtml(item) {
                const alt = escapeHtml(item.company_name);
                const banner = item.hosted_image_path
                    ? `<img class="banner-img" src="${item.hosted_image_path}" alt="${alt}" loading="lazy" onerror="this.remove()">`
                    : '';
                const logo = item.logo_path
                    ? `<img class="logo-badge" src="${item.logo_path}" alt="${alt} logo" loading="lazy" onerror="this.remove()">`
                    : '';
                return banner + logo;
            }

            const starPath = 'M12 2l2.9 6.9 7.5.6-5.7 5 1.7 7.3L12 17.8 5.6 21.8l1.7-7.3-5.7-5 7.5-.6z';
            const starIcon = (filled) => `<svg class="star-icon${filled ? ' filled' : ''}" viewBox="0 0 24 24" fill="currentColor"><path d="${starPath}"/></svg>`;
            const starIconPlain = `<svg class="star-icon" viewBox="0 0 24 24" fill="currentColor"><path d="${starPath}"/></svg>`;

            function ratingSectionHtml(item) {
                if (item.id == null) return ''; // Ratings need a real DB id to attach to
                const agg = ratingsByClassId.get(item.id);
                const avg = agg && agg.count ? agg.sum / agg.count : 0;
                const roundedAvg = Math.round(avg);
                const summaryStars = [1, 2, 3, 4, 5].map(n => starIcon(n <= roundedAvg)).join('');
                const summaryText = agg && agg.count
                    ? `${avg.toFixed(1)} (${agg.count} rating${agg.count === 1 ? '' : 's'})`
                    : (ratingsLoaded ? 'No ratings yet' : '');

                const myRating = myRatingsByClassId.get(item.id);
                const groupName = `rate-${item.id}`;
                const starInputs = [5, 4, 3, 2, 1].map(n => `
                    <input type="radio" name="${groupName}" id="${groupName}-${n}" value="${n}" data-class-id="${item.id}" ${myRating === n ? 'checked' : ''}>
                    <label for="${groupName}-${n}" title="${n} star${n === 1 ? '' : 's'}">${starIconPlain}</label>
                `).join('');

                return `
                    <div class="rating-summary">${summaryStars}<span class="rating-text">${summaryText}</span></div>
                    <div class="rate-row">
                        <span class="rate-label">${myRating ? 'Your rating:' : 'Rate this:'}</span>
                        <div class="star-input">${starInputs}</div>
                    </div>
                `;
            }

            const chevronIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
            const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

            function formatSchedule(item) {
                const parts = [];
                if (Array.isArray(item.days_of_week) && item.days_of_week.length) parts.push(item.days_of_week.join(', '));
                if (item.start_time) parts.push(item.end_time ? `${item.start_time}-${item.end_time}` : `from ${item.start_time}`);
                if (item.term_structure) parts.push(item.term_structure);
                return parts.join(' &middot; ');
            }

            function formatPrice(item) {
                if (item.price_amount == null) return '';
                const basis = item.pricing_basis ? ` ${item.pricing_basis.toLowerCase()}` : '';
                return `${item.price_currency || 'EUR'} ${item.price_amount}${basis}`;
            }

            function cardDetailsHtml(item) {
                const rows = [];

                const schedule = formatSchedule(item);
                if (schedule) rows.push(`<div class="detail-row"><strong>Schedule:</strong> ${schedule}</div>`);

                if (item.age_range_display) rows.push(`<div class="detail-row"><strong>Ages:</strong> ${escapeHtml(item.age_range_display)}</div>`);

                if (item.parental_requirement) rows.push(`<div class="detail-row"><strong>Supervision:</strong> ${escapeHtml(item.parental_requirement)}</div>`);

                const price = formatPrice(item);
                if (price) rows.push(`<div class="detail-row"><strong>Price:</strong> ${escapeHtml(price)}</div>`);
                if (item.pricing_details) rows.push(`<div class="detail-row">${escapeHtml(item.pricing_details)}</div>`);

                if (Array.isArray(item.class_types) && item.class_types.length) {
                    rows.push(`<div class="detail-row"><strong>Class types:</strong> ${escapeHtml(item.class_types.join(', '))}</div>`);
                }

                const contactParts = [];
                if (item.phone_number) contactParts.push(escapeHtml(item.phone_number));
                if (item.email_address) contactParts.push(escapeHtml(item.email_address));
                if (contactParts.length) rows.push(`<div class="detail-row"><strong>Contact:</strong> ${contactParts.join(' &middot; ')}</div>`);

                if (Array.isArray(item.facilities) && item.facilities.length) {
                    rows.push(`<div class="detail-row"><strong>Facilities:</strong><br>${item.facilities.map(f => `<span class="facility-chip">${escapeHtml(f)}</span>`).join('')}</div>`);
                }

                if (item.booking_url && item.booking_url !== item.website_url) {
                    rows.push(`<div class="detail-row"><a href="${escapeHtml(item.booking_url)}" target="_blank" rel="noopener">Booking page &rarr;</a></div>`);
                }

                const verifiedHtml = item.date_verified
                    ? `<div class="verified-badge">${checkIcon} Verified ${escapeHtml(item.date_verified)}</div>`
                    : '';

                return verifiedHtml + rows.join('');
            }

            data.forEach((item, localIndex) => {
                const card = document.createElement('div');
                card.className = 'class-card';
                card.id = `card-${globalStartIndex + localIndex}`;

                const key = getItemKey(item);
                const isFav = favoriteKeys.has(key);

                // Add the claim button at the bottom of the card content
                card.innerHTML = `
                    <button class="favorite-btn${isFav ? ' active' : ''}" data-key="${escapeHtml(key)}" aria-label="${isFav ? 'Remove from shortlist' : 'Add to shortlist'}" title="${isFav ? 'Remove from shortlist' : 'Add to shortlist'}">
                        ${heartIcon(isFav)}
                    </button>
                    <div class="card-image">${cardImageHtml(item)}</div>
                    <div class="card-content">
                        <h2>${item.company_name}</h2>
                        <div class="tag-container">
                            <span class="tag">${item.category || 'Class'}</span>
                            ${item.parental_requirement === 'Drop-off' ? '<span class="tag" style="background:#dcfce7; color:#166534;">Drop-off</span>' : ''}
                            ${item._distanceKm !== undefined ? `<span class="distance-badge">${pinIcon} ${item._distanceKm.toFixed(1)} km</span>` : ''}
                        </div>
                        <p class="description">
                            ${item.description || 'No description available.'}
                        </p>
                        ${ratingSectionHtml(item)}
                        <button class="expand-toggle" type="button">
                            <span class="show-more-text">Show more details</span>
                            <span class="show-less-text">Show less</span>
                            ${chevronIcon}
                        </button>
                        <div class="card-details">
                            ${cardDetailsHtml(item)}
                        </div>
                        <div class="meta-info">
                            <strong>Where:</strong> ${item.address || 'Contact for details'}<br>
                        </div>
                        ${item.id != null && businessIndex.has(String(item.id))
                            ? `<a href="${businessIndex.get(String(item.id))}" class="button" style="background:#f1f5f9; color:var(--text-dark);">Full details</a>`
                            : ''}
                        <a href="${item.website_url || '#'}" target="_blank" class="button">Visit Website</a>
                        <button class="claim-btn" data-id="${item.id || item.company_name}" data-name="${escapeHtml(item.company_name)}">Claim this business</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderPagination() {
            const pageCount = Math.max(1, Math.ceil(filteredData.length / pageSize));
            const paginationControls = document.getElementById('pagination-controls');
            if (filteredData.length <= pageSize) { paginationControls.innerHTML = ''; return; }

            paginationControls.innerHTML = `
                <button class="page-button" id="prev-page" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
                <span style="font-size:0.9rem; font-weight:600;">Page ${currentPage} of ${pageCount}</span>
                <button class="page-button" id="next-page" ${currentPage === pageCount ? 'disabled' : ''}>Next</button>
            `;
            document.getElementById('prev-page')?.addEventListener('click', () => { currentPage--; renderPage(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
            document.getElementById('next-page')?.addEventListener('click', () => { currentPage++; renderPage(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        }

        function renderPage() {
            const start = (currentPage - 1) * pageSize;
            renderClasses(filteredData.slice(start, start + pageSize), start);
            renderPagination();
        }

        async function performSearch() {
            if (!hasTriggeredSearch) {
                hasTriggeredSearch = true;
                heroSection.classList.remove('hero-initial');
                heroSection.classList.add('hero-active');
                mainContent.classList.add('visible');
                initMap();
            }

            const locText = locationInput.value.trim().toLowerCase();
            if (locText && locText !== 'current location' && locText !== lastGeocodedQuery && !isGeocoding) {
                isGeocoding = true;
                const originalPlaceholder = searchBtn.style.opacity;
                searchBtn.style.opacity = '0.6';
                const coords = await geocodeLocation(locationInput.value.trim());
                lastGeocodedQuery = locText;
                userLat = coords ? coords.lat : null;
                userLon = coords ? coords.lon : null;
                searchBtn.style.opacity = originalPlaceholder || '1';
                isGeocoding = false;
                // A location was just resolved for this search — default to showing
                // the closest results first, rather than making the user pick it manually.
                if (coords && !sortExplicitlySet) sortSelect.value = 'distance';
            }

            filterClasses();
        }

        nearMeBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                nearMeBtn.style.color = 'var(--primary)';
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    locationInput.value = 'Current Location';
                    lastGeocodedQuery = 'current location';
                    if (!sortExplicitlySet) sortSelect.value = 'distance';
                    performSearch();
                }, () => {
                    alert("Location access denied or unavailable.");
                    nearMeBtn.style.color = '#94a3b8';
                });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        });

        locationInput.addEventListener('input', () => {
            userLat = null;
            userLon = null;
            lastGeocodedQuery = null;
            nearMeBtn.style.color = '#94a3b8';
        });

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        locationInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });

        categoryFilter.addEventListener('change', () => { if (hasTriggeredSearch) filterClasses(); });
        ageFilter.addEventListener('change', () => { if (hasTriggeredSearch) filterClasses(); });
        dayFilter.addEventListener('change', () => { if (hasTriggeredSearch) filterClasses(); });
        dropoffFilter.addEventListener('change', () => { if (hasTriggeredSearch) filterClasses(); });
        favoritesOnlyFilter.addEventListener('change', () => { if (hasTriggeredSearch) filterClasses(); });
        radiusFilter.addEventListener('change', () => { if (hasTriggeredSearch) filterClasses(); });
        sortSelect.addEventListener('change', () => { sortExplicitlySet = true; if (hasTriggeredSearch) filterClasses(); });

        // --- Claim Business Logic ---
        const claimModal = document.getElementById('claim-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const claimForm = document.getElementById('claim-form');
        const claimSuccess = document.getElementById('claim-success');

        // Close modal events
        closeModalBtn.addEventListener('click', () => { claimModal.classList.remove('active'); });
        claimModal.addEventListener('click', (e) => { if (e.target === claimModal) claimModal.classList.remove('active'); });

        // Open modal via Event Delegation (handles dynamic buttons)
        document.getElementById('directory-container').addEventListener('change', (e) => {
            if (e.target.matches('.star-input input[type="radio"]')) {
                const classId = parseInt(e.target.dataset.classId, 10);
                const rating = parseInt(e.target.value, 10);
                submitRating(classId, rating);
            }
        });

        document.getElementById('directory-container').addEventListener('click', (e) => {
            const favBtn = e.target.closest('.favorite-btn');
            if (favBtn) {
                toggleFavorite(favBtn.dataset.key);
                return;
            }
            if (e.target.classList.contains('claim-btn')) {
                const businessId = e.target.getAttribute('data-id');
                const businessName = e.target.getAttribute('data-name');

                document.getElementById('modal-business-name').textContent = `Claim ${businessName}`;
                document.getElementById('claim-business-id').value = businessId;
                document.getElementById('claim-business-title').value = businessName;

                claimForm.style.display = 'block';
                claimSuccess.style.display = 'none';
                claimForm.reset();
                claimModal.classList.add('active');
                return;
            }
            // Visit Website / booking links and the whole ratings area (the read-only
            // average display, the "Rate this:" label, and the star input itself) have
            // their own behavior -- clicking any of them should not also expand/collapse
            // the card.
            if (e.target.closest('a, .rating-summary, .rate-row')) {
                return;
            }
            const card = e.target.closest('.class-card');
            if (card) {
                card.classList.toggle('expanded');
            }
        });

        // Form Submission to Supabase
        claimForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('claim-submit');
            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;

            const requestData = {
                business_id: document.getElementById('claim-business-id').value,
                business_name: document.getElementById('claim-business-title').value,
                requester_name: document.getElementById('claim-name').value,
                requester_email: document.getElementById('claim-email').value,
                requester_position: document.getElementById('claim-position').value,
                status: 'pending'
            };

            try {
                if (window.supabase) {
                    const supabase = window.supabaseClient;
                    // Insert into the claim_requests table
                    const { error } = await supabase.from('claim_requests').insert([requestData]);
                    if (error) throw error;
                } else {
                    console.warn("Supabase not fully connected. Simulating submission.");
                    await new Promise(resolve => setTimeout(resolve, 800)); 
                }

                claimForm.style.display = 'none';
                claimSuccess.style.display = 'block';
            } catch (err) {
                alert('There was an error submitting your claim. Please check your connection and try again.');
                console.error(err);
            } finally {
                submitBtn.textContent = 'Submit Claim Request';
                submitBtn.disabled = false;
            }
        });

        // Load Initial Data
        Promise.all([loadClasses(), loadRatings(), loadBusinessIndex()]).then(() => {
            populateCategoryFilter();
            const params = new URLSearchParams(window.location.search);
            if (Array.from(params.keys()).length > 0) {
                if(params.has('q')) searchInput.value = params.get('q');
                if(params.has('loc')) locationInput.value = params.get('loc');
                if(params.has('cat')) categoryFilter.value = params.get('cat');
                if(params.has('age')) ageFilter.value = params.get('age');
                if(params.has('day')) dayFilter.value = params.get('day');
                if(params.get('dropoff') === 'true') dropoffFilter.checked = true;
                if(params.has('radius')) radiusFilter.value = params.get('radius');
                if(params.has('sort')) { sortSelect.value = params.get('sort'); sortExplicitlySet = true; }
                performSearch();
            }
        });
    </script>
</body>
</html>
